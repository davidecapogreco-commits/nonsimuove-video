<script>
  // Sceglie da solo la versione giusta: verticale su telefono, orizzontale su PC e tablet in orizzontale.
  // Se lo schermo ruota, passa all'altra versione dallo stesso punto.
  (function () {
    var v = document.getElementById("v");
    var mq = window.matchMedia("(orientation: landscape)");
    var SRC = {
      v: { src: "verticale.mp4", poster: "anteprima_verticale.jpg" },
      h: { src: "orizzontale.mp4", poster: "anteprima_orizzontale.jpg" }
    };
    var current = null;
    function pick() {
      var want = mq.matches ? "h" : "v";
      if (want === current) return;
      var t = v.currentTime || 0, playing = !v.paused && !v.ended;
      current = want;
      v.poster = SRC[want].poster;
      v.src = SRC[want].src;
      if (t > 0) {
        v.addEventListener("loadedmetadata", function once() {
          v.removeEventListener("loadedmetadata", once);
          v.currentTime = Math.min(t, v.duration || t);
          if (playing) v.play().catch(function () {});
        });
      }
    }
    pick();
    if (mq.addEventListener) mq.addEventListener("change", pick); else mq.addListener(pick);
    window.addEventListener("resize", pick);
    window.addEventListener("orientationchange", pick);
  })();
